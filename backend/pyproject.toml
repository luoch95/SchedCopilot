[project]
name = "sched-copilot"
version = "0.2.0"
description = "Schedule Copilot: a human-in-the-loop production scheduling decision assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "streamlit>=1.50,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "sched_copilot"
module-root = "src"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
