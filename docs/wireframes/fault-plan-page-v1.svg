  <rect x="40" y="144" width="850" height="20" fill="#fff"/>
  <text x="66" y="128" class="font label">选择角色　/　工作台总览　/　故障影响与方案决策</text>
  <line x1="40" y1="164" x2="890" y2="164" stroke="#e2ebef"/>
  <text x="66" y="211" class="font title">故障影响与方案决策</text>
  <text x="66" y="239" class="font body">先确认故障影响和当前正式计划，再生成候选排产方案。</text>
  <rect x="66" y="255" width="112" height="27" rx="14" fill="#fff1d6"/>
