  <rect x="66" y="310" width="630" height="145" rx="12" fill="#fff" stroke="#e0e9ed" filter="url(#shadow)"/>
  <text x="88" y="344" class="font h2">1　故障概览</text>
  <rect x="88" y="361" width="176" height="63" rx="8" fill="#f6f9fa"/>
  <text x="103" y="382" class="font label">故障设备</text><text x="103" y="409" class="font value">M3</text>
  <rect x="282" y="361" width="176" height="63" rx="8" fill="#f6f9fa"/>
  <text x="297" y="382" class="font label">故障时段</text><text x="297" y="409" class="font value">13:00 — 17:00</text>
  <rect x="476" y="361" width="194" height="63" rx="8" fill="#f6f9fa"/>
  <text x="491" y="382" class="font label">直接影响</text><text x="491" y="409" class="font value">2 道工序</text>

  <rect x="66" y="475" width="630" height="362" rx="12" fill="#fff" stroke="#e0e9ed" filter="url(#shadow)"/>
  <text x="88" y="510" class="font h2">2　当前正式排产计划</text>
  <text x="674" y="510" text-anchor="end" class="font body">未生成方案时唯一的计划视图</text>
  <line x1="88" y1="528" x2="674" y2="528" stroke="#e6eef1"/>
  <text x="196" y="556" class="font label">08:00</text><text x="314" y="556" class="font label">12:00</text><text x="432" y="556" class="font label">16:00</text><text x="550" y="556" class="font label">20:00</text><text x="650" y="556" class="font label">24:00</text>
  <line x1="196" y1="565" x2="196" y2="775" stroke="#e6eef1"/><line x1="314" y1="565" x2="314" y2="775" stroke="#e6eef1"/><line x1="432" y1="565" x2="432" y2="775" stroke="#e6eef1"/><line x1="550" y1="565" x2="550" y2="775" stroke="#e6eef1"/><line x1="650" y1="565" x2="650" y2="775" stroke="#e6eef1"/>
  <text x="101" y="599" class="font" font-size="12" font-weight="700" fill="#617b88">M1</text><rect x="140" y="578" width="530" height="42" rx="5" fill="#f5f8f9"/><rect x="160" y="586" width="110" height="26" rx="5" fill="#7baebb"/><text x="215" y="604" text-anchor="middle" class="font" font-size="10" font-weight="700" fill="#fff">O1001-OP1</text><rect x="390" y="586" width="180" height="26" rx="5" fill="#287b91"/><text x="480" y="604" text-anchor="middle" class="font" font-size="10" font-weight="700" fill="#fff">当前计划</text>
  <text x="101" y="663" class="font" font-size="12" font-weight="700" fill="#617b88">M2</text><rect x="140" y="642" width="530" height="42" rx="5" fill="#f5f8f9"/><rect x="152" y="650" width="170" height="26" rx="5" fill="#c8ae8e"/><text x="237" y="668" text-anchor="middle" class="font" font-size="10" font-weight="700" fill="#fff">O1003-OP1/2</text><rect x="345" y="650" width="125" height="26" rx="5" fill="#c77565"/><text x="407" y="668" text-anchor="middle" class="font" font-size="10" font-weight="700" fill="#fff">O1005-OP1</text>
  <text x="101" y="727" class="font" font-size="12" font-weight="700" fill="#617b88">M3</text><rect x="140" y="706" width="530" height="42" rx="5" fill="#f5f8f9"/><rect x="245" y="714" width="140" height="26" rx="5" fill="#7baebb"/><text x="315" y="732" text-anchor="middle" class="font" font-size="10" font-weight="700" fill="#fff">O1001-OP2</text><rect x="420" y="714" width="120" height="26" rx="5" fill="#e7b9ae" stroke="#d27b6b" stroke-dasharray="4 3"/><text x="480" y="732" text-anchor="middle" class="font" font-size="10" font-weight="700" fill="#a4554c">故障时段</text>
  <text x="88" y="798" class="font body">当前只展示事实，不提前显示候选方案、比较结论或确认按钮。</text>

  <rect x="66" y="857" width="630" height="175" rx="12" fill="#fff" stroke="#e0e9ed" filter="url(#shadow)"/>
  <text x="88" y="892" class="font h2">3　生成候选方案</text>
  <text x="88" y="918" class="font body">系统按故障、换型和设备资源约束生成可比较的候选计划。</text>
  <rect x="88" y="944" width="178" height="44" rx="8" fill="#126c7b"/><text x="177" y="972" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#fff">生成候选方案</text>
  <text x="288" y="971" class="font" font-size="13" font-weight="600" fill="#176e7f">查看本次 Agent 链路 →</text>
  <text x="88" y="1012" class="font label">点击后在此卡片内显示“等待结果中……”和各 Agent 状态。</text>

  <!-- left outline -->
  <line x1="726" y1="310" x2="726" y2="1032" stroke="#e1eaee"/>
  <text x="755" y="344" class="font" font-size="14" font-weight="700" fill="#536d7d">本页提纲</text>
  <rect x="746" y="365" width="116" height="32" rx="8" fill="#e7f3f5"/><text x="760" y="386" class="font outline" font-weight="700" fill="#146b7b">故障概览</text>
  <text x="760" y="436" class="font outline">当前正式计划</text>
  <text x="760" y="486" class="font outline">生成候选方案</text>

