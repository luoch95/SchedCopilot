  <text x="936" y="128" class="font label">选择角色　/　工作台总览　/　故障影响与方案决策</text>
  <line x1="910" y1="164" x2="1760" y2="164" stroke="#e2ebef"/>
  <text x="936" y="211" class="font title">故障影响与方案决策</text>
  <text x="936" y="239" class="font body">候选方案已生成，请比较差异并确认是否发布。</text>
  <rect x="936" y="255" width="132" height="27" rx="14" fill="#e7f4ee"/><text x="1002" y="273" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#24734c">待计划员确认</text>
  <text x="1710" y="273" text-anchor="end" class="font body">排产计划员　·　仿真数据</text>

  <rect x="936" y="310" width="630" height="145" rx="12" fill="#fff" stroke="#e0e9ed" filter="url(#shadow)"/>
  <text x="958" y="344" class="font h2">1　方案结论</text>
  <rect x="1374" y="326" width="166" height="27" rx="14" fill="#e7f4ee"/><text x="1457" y="344" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#24734c">可执行 · 待确认</text>
  <text x="958" y="376" class="font" font-size="15" font-weight="700" fill="#203d4c">建议采用候选方案，将受影响工序转移至可用设备。</text>
  <text x="958" y="404" class="font body">结论基于已校验事实，并提供依据和风险供计划员审核。</text>
  <text x="958" y="432" class="font" font-size="12" font-weight="600" fill="#176e7f">查看关键变化　·　查看依据</text>

  <rect x="936" y="475" width="630" height="165" rx="12" fill="#fff" stroke="#e0e9ed" filter="url(#shadow)"/>
  <text x="958" y="509" class="font h2">2　方案对比</text><text x="1544" y="509" text-anchor="end" class="font body">同一时间轴对照变化</text>
  <rect x="958" y="529" width="280" height="86" rx="8" fill="#f7fafb" stroke="#e5ecef"/><rect x="974" y="542" width="4" height="18" rx="2" fill="#7b9aa7"/><text x="989" y="557" class="font" font-size="13" font-weight="700" fill="#435d6b">当前正式计划</text><text x="989" y="587" class="font body">受影响 2 道工序</text><text x="989" y="606" class="font body">保持原设备与原时间</text>
  <rect x="1255" y="529" width="280" height="86" rx="8" fill="#f7fafb" stroke="#e5ecef"/><rect x="1271" y="542" width="4" height="18" rx="2" fill="#219078"/><text x="1286" y="557" class="font" font-size="13" font-weight="700" fill="#435d6b">候选排产方案</text><text x="1286" y="587" class="font body">转移 1 道工序</text><text x="1286" y="606" class="font body">提前 15 分钟开工</text>

  <rect x="936" y="660" width="630" height="210" rx="12" fill="#fff" stroke="#e0e9ed" filter="url(#shadow)"/>
  <text x="958" y="694" class="font h2">3　候选排产计划</text><text x="1544" y="694" text-anchor="end" class="font body">设备 · 时间 · 工序</text>
  <text x="1045" y="721" class="font label">08:00</text><text x="1155" y="721" class="font label">12:00</text><text x="1265" y="721" class="font label">16:00</text><text x="1375" y="721" class="font label">20:00</text><text x="1475" y="721" class="font label">24:00</text>
  <line x1="1045" y1="730" x2="1045" y2="835" stroke="#e6eef1"/><line x1="1155" y1="730" x2="1155" y2="835" stroke="#e6eef1"/><line x1="1265" y1="730" x2="1265" y2="835" stroke="#e6eef1"/><line x1="1375" y1="730" x2="1375" y2="835" stroke="#e6eef1"/><line x1="1475" y1="730" x2="1475" y2="835" stroke="#e6eef1"/>
  <text x="958" y="758" class="font" font-size="12" font-weight="700" fill="#617b88">M1</text><rect x="995" y="742" width="540" height="26" rx="5" fill="#f5f8f9"/><rect x="1020" y="747" width="105" height="16" rx="4" fill="#7baebb"/><rect x="1240" y="747" width="190" height="16" rx="4" fill="#287b91"/>
  <text x="958" y="793" class="font" font-size="12" font-weight="700" fill="#617b88">M2</text><rect x="995" y="777" width="540" height="26" rx="5" fill="#f5f8f9"/><rect x="1010" y="782" width="155" height="16" rx="4" fill="#c8ae8e"/><rect x="1185" y="782" width="120" height="16" rx="4" fill="#c77565"/>
  <text x="958" y="828" class="font" font-size="12" font-weight="700" fill="#617b88">M3</text><rect x="995" y="812" width="540" height="26" rx="5" fill="#f5f8f9"/><rect x="1260" y="817" width="130" height="16" rx="4" fill="#219078"/><text x="1325" y="830" text-anchor="middle" class="font" font-size="9" font-weight="700" fill="#fff">O1002-OP2</text>

  <rect x="936" y="890" width="630" height="92" rx="12" fill="#fff" stroke="#e0e9ed" filter="url(#shadow)"/>
  <text x="958" y="923" class="font h2">4　依据与风险</text><text x="958" y="951" class="font body">换型、设备约束、影响链和未满足条件集中查看。</text><text x="1544" y="951" text-anchor="end" class="font" font-size="12" font-weight="600" fill="#176e7f">展开查看依据　→</text>
  <rect x="936" y="1002" width="630" height="55" rx="12" fill="#fff" stroke="#e0e9ed" filter="url(#shadow)"/>
  <text x="958" y="1035" class="font h2" font-size="16">5　人工确认</text><rect x="1320" y="1015" width="100" height="34" rx="8" fill="#fff" stroke="#cbd8df"/><text x="1370" y="1037" text-anchor="middle" class="font" font-size="12" font-weight="600" fill="#4c6876">返回调整</text><rect x="1430" y="1015" width="115" height="34" rx="8" fill="#126c7b"/><text x="1487" y="1037" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#fff">确认并发布</text>

  <line x1="1596" y1="310" x2="1596" y2="1057" stroke="#e1eaee"/>
  <text x="1620" y="344" class="font" font-size="14" font-weight="700" fill="#536d7d">本页提纲</text>
  <rect x="1610" y="365" width="125" height="32" rx="8" fill="#e7f3f5"/><text x="1624" y="386" class="font outline" font-weight="700" fill="#146b7b">方案结论</text>
  <text x="1624" y="436" class="font outline">方案对比</text><text x="1624" y="486" class="font outline">候选排产计划</text><text x="1624" y="536" class="font outline">依据与风险</text><text x="1624" y="586" class="font outline">人工确认</text>

  <text x="50" y="1100" class="font" font-size="13" fill="#5d7480">视觉原则：标题只保留一个主标题；卡片按用户决策顺序排列；状态未到达的内容不提前出现；右侧提纲跟随状态切换。</text>
