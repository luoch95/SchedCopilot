<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173346" flood-opacity="0.08"/>
    </filter>
    <style>
      .font { font-family: Inter, "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 27px; font-weight: 700; fill: #173346; }
      .h2 { font-size: 18px; font-weight: 700; fill: #203d4c; }
      .body { font-size: 13px; fill: #667d89; }
      .label { font-size: 11px; fill: #78909c; }
      .value { font-size: 17px; font-weight: 700; fill: #244452; }
      .outline { font-size: 13px; fill: #718792; }
    </style>
  </defs>
  <rect width="1800" height="1120" fill="#edf3f6"/>
  <text x="50" y="42" class="font" font-size="25" font-weight="700" fill="#173346">故障影响与方案决策 · 页面结构视觉稿 v1</text>
  <text x="50" y="70" class="font body">按页面状态拆分内容，只让用户看到当前阶段需要处理的卡片</text>
  <rect x="1530" y="25" width="220" height="32" rx="16" fill="#fff1d6"/>
  <text x="1640" y="46" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#966617">等待确认后再改前端</text>

  <!-- left state -->
  <rect x="40" y="102" width="850" height="970" rx="16" fill="#f8fbfc" stroke="#d7e3e8"/>
